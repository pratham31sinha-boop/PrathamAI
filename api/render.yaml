services:
  - type: web
    name: pratham-ai-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --worker-class gthread --workers 1 --threads 8 --timeout 6100 --graceful-timeout 25 --keep-alive 5 --access-logfile - --error-logfile - "app:app"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PRATHAM_AI_MODE
        value: google_oauth
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: DEEPINFRA_API_KEY
        sync: false
      - key: FIREWORKS_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: GITHUB_API_KEY
        sync: false
      - key: SAMBANOVA_API_KEY
        sync: false