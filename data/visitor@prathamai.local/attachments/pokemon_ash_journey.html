<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokémon: Ash's Journey (Game Boy Classic Style)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #0b0f19;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #gameboy-shell {
            background: #990000;
            padding: 18px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 4px 6px rgba(255,255,255,0.3);
            border: 4px solid #660000;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 640px;
            width: 100%;
        }
        .screen-lens {
            background: #8b956d;
            padding: 12px;
            border-radius: 8px;
            border: 4px solid #333;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.6);
            margin-bottom: 15px;
        }
        canvas {
            background: #9bbc0f;
            display: block;
            width: 480px;
            height: 320px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 2px solid #0f380f;
        }
        #controls-panel {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }
        .dpad-container {
            position: relative;
            width: 130px;
            height: 130px;
            background: #222;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .dpad-btn {
            position: absolute;
            background: #333;
            border: 2px solid #111;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px #111;
            transition: background 0.1s;
        }
        .dpad-btn:active {
            background: #555;
            box-shadow: 0 1px #111;
            transform: translateY(2px);
        }
        .dpad-up { top: 5px; left: 45px; width: 40px; height: 40px; border-radius: 4px 4px 0 0; }
        .dpad-down { bottom: 5px; left: 45px; width: 40px; height: 40px; border-radius: 0 0 4px 4px; }
        .dpad-left { top: 45px; left: 5px; width: 40px; height: 40px; border-radius: 4px 0 0 4px; }
        .dpad-right { top: 45px; right: 5px; width: 40px; height: 40px; border-radius: 0 4px 4px 0; }

        .action-buttons {
            display: flex;
            gap: 15px;
            transform: rotate(-25deg);
            margin-right: 15px;
        }
        .action-btn {
            width: 55px;
            height: 55px;
            background: #cc0000;
            border: 3px solid #880000;
            border-radius: 50%;
            color: #ffcccc;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 5px #660000;
        }
        .action-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px #660000;
        }
        #hud-info {
            font-size: 12px;
            color: #ffcc00;
            margin-bottom: 8px;
            text-align: center;
            font-weight: bold;
            text-shadow: 1px 1px #000;
        }
    </style>
</head>
<body>

<div id="gameboy-shell">
    <div id="hud-info">ASH'S JOURNEY: PALLET TOWN ➔ PEWTER GYM ➔ CERULEAN</div>
    <div class="screen-lens">
        <canvas id="gameCanvas" width="480" height="320"></canvas>
    </div>
    <div id="controls-panel">
        <div class="dpad-container">
            <div class="dpad-btn dpad-up" ontouchstart="setKey('ArrowUp', true)" ontouchend="setKey('ArrowUp', false)" onmousedown="setKey('ArrowUp', true)" onmouseup="setKey('ArrowUp', false)">▲</div>
            <div class="dpad-btn dpad-down" ontouchstart="setKey('ArrowDown', true)" ontouchend="setKey('ArrowDown', false)" onmousedown="setKey('ArrowDown', true)" onmouseup="setKey('ArrowDown', false)">▼</div>
            <div class="dpad-btn dpad-left" ontouchstart="setKey('ArrowLeft', true)" ontouchend="setKey('ArrowLeft', false)" onmousedown="setKey('ArrowLeft', true)" onmouseup="setKey('ArrowLeft', false)">◀</div>
            <div class="dpad-btn dpad-right" ontouchstart="setKey('ArrowRight', true)" ontouchend="setKey('ArrowRight', false)" onmousedown="setKey('ArrowRight', true)" onmouseup="setKey('ArrowRight', false)">▶</div>
        </div>
        <div class="action-buttons">
            <div class="action-btn" ontouchstart="triggerAction('B')" onmousedown="triggerAction('B')">B</div>
            <div class="action-btn" ontouchstart="triggerAction('A')" onmousedown="triggerAction('A')">A</div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    // Load Assets
    const ashImg = new Image();
    ashImg.src = 'assets/ash_ketchum.png';

    const pikachuImg = new Image();
    pikachuImg.src = 'assets/pikachu.png';

    // Game States: 'MAP', 'BATTLE', 'DIALOGUE', 'VICTORY'
    let gameState = 'MAP';
    let subState = 'EXPLORE'; // EXPLORE, MENU

    // Ash Player Object
    let ash = {
        x: 100,
        y: 100,
        speed: 2,
        direction: 'DOWN', // UP, DOWN, LEFT, RIGHT
        badges: 0,
        score: 0
    };

    // Active Pokémon Party
    let party = [
        { name: 'Pikachu', lvl: 12, hp: 45, maxHp: 45, move: 'Thunder Shock', dmg: 22 },
        { name: 'Charmander', lvl: 10, hp: 38, maxHp: 38, move: 'Ember', dmg: 20 },
        { name: 'Bulbasaur', lvl: 10, hp: 40, maxHp: 40, move: 'Vine Whip', dmg: 18 }
    ];
    let activePokemonIndex = 0;

    // Current Battle Opponent
    let opponent = {
        name: 'Wild Pidgey',
        lvl: 5,
        hp: 30,
        maxHp: 30,
        type: 'wild'
    };

    let dialogueText = "Press A to talk / interact. Explore Route 1!";
    let keys = {};

    window.addEventListener('keydown', e => {
        keys[e.key] = true;
        if(e.key === 'z' || e.key === 'Enter' || e.key === ' ') {
            triggerAction('A');
        }
        if(e.key === 'x') {
            triggerAction('B');
        }
    });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    function setKey(code, isDown) {
        keys[code] = isDown;
    }

    function triggerAction(btn) {
        if(gameState === 'MAP') {
            // Check interaction with NPC / Gym / Grass
            if(Math.abs(ash.x - 220) < 30 && Math.abs(ash.y - 80) < 30) {
                startBattle('Brock (Pewter Gym Leader)', 'Onix', 14, 60, 'gym');
            } else if(ash.x > 300 && ash.y > 200) {
                startBattle('Wild Pikachu', 'Wild Pikachu', 8, 35, 'wild');
            } else {
                dialogueText = "Ash: 'Let's become a Pokémon Master!'";
            }
        } else if(gameState === 'BATTLE') {
            if(btn === 'A') {
                // Execute Attack
                let active = party[activePokemonIndex];
                opponent.hp -= active.dmg;
                if(opponent.hp <= 0) {
                    opponent.hp = 0;
                    dialogueText = `${opponent.name} fainted! You won!`;
                    setTimeout(() => {
                        gameState = 'MAP';
                        ash.score += 150;
                        if(opponent.type === 'gym') {
                            ash.badges++;
                            dialogueText = "Got Boulder Badge from Brock!";
                        }
                    }, 1500);
                } else {
                    // Opponent counter-attacks
                    let counterDmg = 12;
                    active.hp -= counterDmg;
                    dialogueText = `${active.name} used ${active.move}! Opponent HP: ${opponent.hp}\n${opponent.name} counter-attacked for ${counterDmg} dmg!`;
                    if(active.hp <= 0) {
                        active.hp = 0;
                        dialogueText = `${active.name} fainted! Switch Pokémon!`;
                    }
                }
            } else if(btn === 'B') {
                // Attempt escape
                if(opponent.type === 'wild') {
                    gameState = 'MAP';
                    dialogueText = "Got away safely!";
                } else {
                    dialogueText = "Cannot run from a Gym Battle!";
                }
            }
        }
    }

    function startBattle(name, pokeName, lvl, hp, type) {
        gameState = 'BATTLE';
        opponent = { name: name, pokeName: pokeName, lvl: lvl, hp: hp, maxHp: hp, type: type };
        dialogueText = `Battle started vs ${name}!`;
    }

    function update() {
        if(gameState === 'MAP') {
            if(keys['ArrowUp'] || keys['w']) { ash.y = Math.max(20, ash.y - ash.speed); ash.direction = 'UP'; }
            if(keys['ArrowDown'] || keys['s']) { ash.y = Math.min(280, ash.y + ash.speed); ash.direction = 'DOWN'; }
            if(keys['ArrowLeft'] || keys['a']) { ash.x = Math.max(20, ash.x - ash.speed); ash.direction = 'LEFT'; }
            if(keys['ArrowRight'] || keys['d']) { ash.x = Math.min(440, ash.x + ash.speed); ash.direction = 'RIGHT'; }

            // Random wild encounter check in tall grass zone
            if(ash.x > 250 && ash.y > 150 && Math.random() < 0.015) {
                let wildList = [
                    {name: 'Wild Pidgey', lvl: 4, hp: 25},
                    {name: 'Wild Rattata', lvl: 3, hp: 22},
                    {name: 'Wild Caterpie', lvl: 3, hp: 20}
                ];
                let w = wildList[Math.floor(Math.random() * wildList.length)];
                startBattle(w.name, w.name, w.lvl, w.hp, 'wild');
            }
        }
    }

    function drawMap() {
        // Background Green (Palette: #9bbc0f, #8bac0f, #306230, #0f380f)
        ctx.fillStyle = '#9bbc0f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Pallet Town Path & Tall Grass
        ctx.fillStyle = '#8bac0f';
        // Roads
        ctx.fillRect(0, 120, 480, 40);
        ctx.fillRect(220, 0, 40, 320);

        // Tall Grass (Route 1)
        ctx.fillStyle = '#306230';
        for(let gx = 280; gx < 460; gx += 20) {
            for(let gy = 180; gy < 300; gy += 20) {
                ctx.fillRect(gx, gy, 14, 14);
            }
        }

        // Pewter Gym Building
        ctx.fillStyle = '#333';
        ctx.fillRect(190, 40, 100, 60);
        ctx.fillStyle = '#ffcc00';
        ctx.font = '8px Courier New';
        ctx.fillText('PEWTER GYM', 205, 75);

        // Oak's Lab / House
        ctx.fillStyle = '#cc3333';
        ctx.fillRect(40, 40, 80, 60);
        ctx.fillStyle = '#fff';
        ctx.fillText('PALLET LAB', 48, 75);

        // Draw Ash
        if(ashImg.complete) {
            ctx.drawImage(ashImg, ash.x, ash.y, 24, 28);
        } else {
            ctx.fillStyle = '#cc0000';
            ctx.fillRect(ash.x, ash.y, 16, 20);
        }

        // HUD / Text Box at bottom
        ctx.fillStyle = '#0f380f';
        ctx.fillRect(0, 240, 480, 80);
        ctx.strokeStyle = '#9bbc0f';
        ctx.lineWidth = 2;
        ctx.strokeRect(4, 244, 472, 72);

        ctx.fillStyle = '#9bbc0f';
        ctx.font = '10px Courier New';
        ctx.fillText(`ASH | Badges: ${ash.badges}/8 | Score: ${ash.score}`, 12, 260);
        ctx.fillText(dialogueText, 12, 285);
        ctx.fillText(`Active: ${party[activePokemonIndex].name} (HP: ${party[activePokemonIndex].hp}/${party[activePokemonIndex].maxHp})`, 12, 305);
    }

    function drawBattle() {
        // Battle Screen background
        ctx.fillStyle = '#f0f0f0';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Battle arena boxes
        // Opponent status box
        ctx.fillStyle = '#ddd';
        ctx.fillRect(260, 20, 200, 50);
        ctx.strokeStyle = '#333';
        ctx.strokeRect(260, 20, 200, 50);
        ctx.fillStyle = '#000';
        ctx.font = '10px Courier New';
        ctx.fillText(`${opponent.name} Lv${opponent.lvl}`, 275, 38);
        ctx.fillStyle = '#228822';
        ctx.fillRect(330, 46, (opponent.hp / opponent.maxHp) * 110, 8);

        // Player status box
        ctx.fillStyle = '#ddd';
        ctx.fillRect(20, 150, 200, 50);
        ctx.strokeStyle = '#333';
        ctx.strokeRect(20, 150, 200, 50);
        ctx.fillStyle = '#000';
        let active = party[activePokemonIndex];
        ctx.fillText(`${active.name} Lv${active.lvl}`, 35, 168);
        ctx.fillStyle = '#228822';
        ctx.fillRect(95, 176, (active.hp / active.maxHp) * 110, 8);

        // Draw Opponent Sprite / Placeholder
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(350, 80, 60, 60);

        // Draw Pikachu/Ash sprite
        if(pikachuImg.complete) {
            ctx.drawImage(pikachuImg, 80, 180, 50, 50);
        } else {
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(80, 180, 40, 40);
        }

        // Message / Command Box at bottom
        ctx.fillStyle = '#0f380f';
        ctx.fillRect(0, 230, 480, 90);
        ctx.strokeStyle = '#9bbc0f';
        ctx.strokeRect(4, 234, 472, 82);

        ctx.fillStyle = '#9bbc0f';
        ctx.font = '11px Courier New';
        ctx.fillText(dialogueText, 16, 260);
        ctx.fillText(`[A] Use ${active.move}   [B] Run / Escape`, 16, 290);
    }

    function gameLoop() {
        update();
        if(gameState === 'MAP') {
            drawMap();
        } else if(gameState === 'BATTLE') {
            drawBattle();
        }
        requestAnimationFrame(gameLoop);
    }

    window.onload = () => {
        gameLoop();
    };
</script>

</body>
</html>
