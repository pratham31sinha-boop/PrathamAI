<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokémon: Ash's Kanto Journey</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #090d16;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #gameboy-shell {
            background: #b30000;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 4px 6px rgba(255,255,255,0.3);
            border: 4px solid #660000;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 540px;
            width: 100%;
        }
        #hud-header {
            font-size: 11px;
            color: #ffcc00;
            margin-bottom: 8px;
            text-align: center;
            font-weight: bold;
            text-shadow: 1px 1px #000;
            letter-spacing: 1px;
        }
        .screen-lens {
            background: #8b956d;
            padding: 10px;
            border-radius: 8px;
            border: 4px solid #222;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.7);
            margin-bottom: 12px;
        }
        canvas {
            background: #9bbc0f;
            display: block;
            width: 480px;
            height: 320px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 2px solid #0f380f;
        }
        #controls-panel {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }
        .dpad-container {
            position: relative;
            width: 120px;
            height: 120px;
            background: #1a1a1a;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
        }
        .dpad-btn {
            position: absolute;
            background: #2c2c2c;
            border: 2px solid #111;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px #111;
        }
        .dpad-btn:active {
            background: #444;
            box-shadow: 0 1px #111;
            transform: translateY(2px);
        }
        .dpad-up { top: 4px; left: 40px; width: 40px; height: 38px; border-radius: 4px 4px 0 0; }
        .dpad-down { bottom: 4px; left: 40px; width: 40px; height: 38px; border-radius: 0 0 4px 4px; }
        .dpad-left { top: 40px; left: 4px; width: 38px; height: 40px; border-radius: 4px 0 0 4px; }
        .dpad-right { top: 40px; right: 4px; width: 38px; height: 40px; border-radius: 0 4px 4px 0; }

        .action-buttons {
            display: flex;
            gap: 15px;
            transform: rotate(-25deg);
            margin-right: 15px;
        }
        .action-btn {
            width: 52px;
            height: 52px;
            background: #e60000;
            border: 3px solid #800000;
            border-radius: 50%;
            color: #ffcccc;
            font-weight: bold;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 5px #500000;
        }
        .action-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px #500000;
        }
    </style>
</head>
<body>

<div id="gameboy-shell">
    <div id="hud-header">ASH KETCHUM'S JOURNEY: PALLET ➔ PEWTER ➔ CERULEAN</div>
    <div class="screen-lens">
        <canvas id="gameCanvas" width="480" height="320"></canvas>
    </div>
    <div id="controls-panel">
        <div class="dpad-container">
            <div class="dpad-btn dpad-up" ontouchstart="setKey('ArrowUp', true)" ontouchend="setKey('ArrowUp', false)" onmousedown="setKey('ArrowUp', true)" onmouseup="setKey('ArrowUp', false)">▲</div>
            <div class="dpad-btn dpad-down" ontouchstart="setKey('ArrowDown', true)" ontouchend="setKey('ArrowDown', false)" onmousedown="setKey('ArrowDown', true)" onmouseup="setKey('ArrowDown', false)">▼</div>
            <div class="dpad-btn dpad-left" ontouchstart="setKey('ArrowLeft', true)" ontouchend="setKey('ArrowLeft', false)" onmousedown="setKey('ArrowLeft', true)" onmouseup="setKey('ArrowLeft', false)">◀</div>
            <div class="dpad-btn dpad-right" ontouchstart="setKey('ArrowRight', true)" ontouchend="setKey('ArrowRight', false)" onmousedown="setKey('ArrowRight', true)" onmouseup="setKey('ArrowRight', false)">▶</div>
        </div>
        <div class="action-buttons">
            <div class="action-btn" ontouchstart="triggerAction('B')" onmousedown="triggerAction('B')">B</div>
            <div class="action-btn" ontouchstart="triggerAction('A')" onmousedown="triggerAction('A')">A</div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    // Load verified workspace assets
    const pikachuImg = new Image();
    pikachuImg.src = 'assets/pikachu.png';

    const charmanderImg = new Image();
    charmanderImg.src = 'assets/charmander.png';

    // Game States: 'MAP', 'BATTLE', 'VICTORY'
    let gameState = 'MAP';

    let ash = {
        x: 100,
        y: 120,
        speed: 2.5,
        badges: 0,
        score: 0
    };

    let party = [
        { name: 'Pikachu', lvl: 12, hp: 45, maxHp: 45, move: 'Thunder Shock', dmg: 22 },
        { name: 'Charmander', lvl: 10, hp: 38, maxHp: 38, move: 'Ember', dmg: 20 }
    ];
    let activeMonIndex = 0;

    let opponent = {
        name: 'Wild Pidgey',
        lvl: 5,
        hp: 30,
        maxHp: 30,
        type: 'wild'
    };

    let dialogueText = "Press A to interact / [Enter] to select. Explore Route 1!";
    let keys = {};

    window.addEventListener('keydown', e => {
        keys[e.key] = true;
        if(e.key === 'z' || e.key === 'Enter' || e.key === ' ') {
            triggerAction('A');
        }
        if(e.key === 'x') {
            triggerAction('B');
        }
    });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    function setKey(key, isDown) {
        keys[key] = isDown;
    }

    function triggerAction(btn) {
        if(gameState === 'MAP') {
            // Check interaction with Pewter Gym (top)
            if(Math.abs(ash.x - 220) < 35 && Math.abs(ash.y - 60) < 35) {
                startBattle('Gym Leader Brock', 'Onix', 14, 65, 'gym');
            } else {
                dialogueText = "Ash: 'Pikachu, let's become Pokémon Masters!'";
            }
        } else if(gameState === 'BATTLE') {
            if(btn === 'A') {
                let active = party[activeMonIndex];
                opponent.hp -= active.dmg;
                if(opponent.hp <= 0) {
                    opponent.hp = 0;
                    dialogueText = `${opponent.name} fainted! You won!`;
                    setTimeout(() => {
                        gameState = 'MAP';
                        ash.score += 200;
                        if(opponent.type === 'gym') {
                            ash.badges++;
                            dialogueText = "Obtained Boulder Badge from Brock!";
                        } else {
                            dialogueText = "Victory! Ash gained experience!";
                        }
                    }, 1400);
                } else {
                    let counter = 10;
                    active.hp -= counter;
                    dialogueText = `${active.name} used ${active.move}! Opponent HP: ${opponent.hp}\n${opponent.name} hit back for ${counter} dmg!`;
                    if(active.hp <= 0) {
                        active.hp = 0;
                        dialogueText = `${active.name} fainted! Switch Pokémon!`;
                    }
                }
            } else if(btn === 'B') {
                if(opponent.type === 'wild') {
                    gameState = 'MAP';
                    dialogueText = "Got away safely!";
                } else {
                    dialogueText = "Can't run from a Gym Leader!";
                }
            }
        }
    }

    function startBattle(name, pokeName, lvl, hp, type) {
        gameState = 'BATTLE';
        opponent = { name: name, pokeName: pokeName, lvl: lvl, hp: hp, maxHp: hp, type: type };
        dialogueText = `Battle started vs ${name}!`;
    }

    function update() {
        if(gameState === 'MAP') {
            if(keys['ArrowUp'] || keys['w']) ash.y = Math.max(15, ash.y - ash.speed);
            if(keys['ArrowDown'] || keys['s']) ash.y = Math.min(270, ash.y + ash.speed);
            if(keys['ArrowLeft'] || keys['a']) ash.x = Math.max(15, ash.x - ash.speed);
            if(keys['ArrowRight'] || keys['d']) ash.x = Math.min(450, ash.x + ash.speed);

            // Tall grass encounter check on right side
            if(ash.x > 280 && ash.y > 150 && Math.random() < 0.02) {
                let wildList = [
                    {name: 'Wild Pidgey', lvl: 4, hp: 25},
                    {name: 'Wild Rattata', lvl: 4, hp: 22},
                    {name: 'Wild Caterpie', lvl: 3, hp: 20}
                ];
                let w = wildList[Math.floor(Math.random() * wildList.length)];
                startBattle(w.name, w.name, w.lvl, w.hp, 'wild');
            }
        }
    }

    function drawMap() {
        // Game Boy green palette background (#9bbc0f)
        ctx.fillStyle = '#9bbc0f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Roads / Paths (#8bac0f)
        ctx.fillStyle = '#8bac0f';
        ctx.fillRect(0, 110, 480, 45);
        ctx.fillRect(210, 0, 45, 320);

        // Tall Grass (#306230)
        ctx.fillStyle = '#306230';
        for(let gx = 300; gx < 465; gx += 18) {
            for(let gy = 175; gy < 300; gy += 18) {
                ctx.fillRect(gx, gy, 12, 12);
            }
        }

        // Pewter Gym Building
        ctx.fillStyle = '#333';
        ctx.fillRect(180, 30, 100, 55);
        ctx.fillStyle = '#ffcc00';
        ctx.font = '8px Courier New';
        ctx.fillText('PEWTER GYM', 194, 60);

        // Pallet Lab
        ctx.fillStyle = '#cc3333';
        ctx.fillRect(30, 30, 75, 55);
        ctx.fillStyle = '#fff';
        ctx.fillText("OAK'S LAB", 36, 60);

        // Draw Ash (Player)
        ctx.fillStyle = '#cc0000';
        ctx.fillRect(ash.x, ash.y, 18, 24);
        ctx.fillStyle = '#ffcc00'; // Hat brim
        ctx.fillRect(ash.x - 2, ash.y, 22, 6);

        // Draw Pikachu following Ash
        if(pikachuImg.complete) {
            ctx.drawImage(pikachuImg, ash.x - 18, ash.y + 4, 20, 20);
        } else {
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(ash.x - 16, ash.y + 4, 16, 16);
        }

        // HUD / Dialogue Box
        ctx.fillStyle = '#0f380f';
        ctx.fillRect(0, 240, 480, 80);
        ctx.strokeStyle = '#9bbc0f';
        ctx.lineWidth = 2;
        ctx.strokeRect(4, 244, 472, 72);

        ctx.fillStyle = '#9bbc0f';
        ctx.font = '10px Courier New';
        ctx.fillText(`ASH | Badges: ${ash.badges}/8 | Score: ${ash.score}`, 12, 262);
        ctx.fillText(dialogueText, 12, 286);
        let active = party[activeMonIndex];
        ctx.fillText(`Active: ${active.name} (HP: ${active.hp}/${active.maxHp})`, 12, 306);
    }

    function drawBattle() {
        ctx.fillStyle = '#f0f0f0';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Opponent Status Box
        ctx.fillStyle = '#ddd';
        ctx.fillRect(260, 20, 200, 50);
        ctx.strokeStyle = '#333';
        ctx.strokeRect(260, 20, 200, 50);
        ctx.fillStyle = '#000';
        ctx.font = '10px Courier New';
        ctx.fillText(`${opponent.name} Lv${opponent.lvl}`, 275, 38);
        ctx.fillStyle = '#228822';
        ctx.fillRect(330, 46, Math.max(0, (opponent.hp / opponent.maxHp) * 110), 8);

        // Player Status Box
        ctx.fillStyle = '#ddd';
        ctx.fillRect(20, 150, 200, 50);
        ctx.strokeStyle = '#333';
        ctx.strokeRect(20, 150, 200, 50);
        ctx.fillStyle = '#000';
        let active = party[activeMonIndex];
        ctx.fillText(`${active.name} Lv${active.lvl}`, 35, 168);
        ctx.fillStyle = '#228822';
        ctx.fillRect(95, 176, Math.max(0, (active.hp / active.maxHp) * 110), 8);

        // Draw Opponent Sprite
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(350, 80, 60, 60);

        // Draw Pikachu in Battle
        if(pikachuImg.complete) {
            ctx.drawImage(pikachuImg, 80, 180, 55, 55);
        } else {
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(80, 180, 45, 45);
        }

        // Battle Dialogue Box
        ctx.fillStyle = '#0f380f';
        ctx.fillRect(0, 230, 480, 90);
        ctx.strokeStyle = '#9bbc0f';
        ctx.strokeRect(4, 234, 472, 82);

        ctx.fillStyle = '#9bbc0f';
        ctx.font = '11px Courier New';
        ctx.fillText(dialogueText, 16, 260);
        ctx.fillText(`[A] Use ${active.move}   [B] Run`, 16, 290);
    }

    function gameLoop() {
        update();
        if(gameState === 'MAP') {
            drawMap();
        } else if(gameState === 'BATTLE') {
            drawBattle();
        }
        requestAnimationFrame(gameLoop);
    }

    window.onload = () => {
        gameLoop();
    };
</script>

</body>
</html>
