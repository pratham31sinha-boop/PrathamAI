<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3DS Star Quest - 3D Dual Screen Adventure</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background: #11141c;
    color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  
  /* 3DS Console Case Outer */
  #console-chassis {
    width: 95vw;
    max-width: 480px;
    background: linear-gradient(145deg, #1b2838, #0e1622);
    border: 4px solid #2d4259;
    border-radius: 28px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 2px 4px rgba(255,255,255,0.2);
    padding: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    position: relative;
  }

  /* 3DS Hinge Accent */
  .hinge {
    width: 80%;
    height: 8px;
    background: #080d14;
    border-radius: 4px;
    border-top: 1px solid #334a65;
  }

  /* TOP SCREEN: Widescreen 3D Viewport */
  .top-screen-housing {
    width: 100%;
    height: 240px;
    background: #000;
    border: 3px solid #1f2a37;
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.9);
  }
  #webgl-canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .screen-banner {
    position: absolute;
    top: 8px;
    left: 10px;
    background: rgba(0, 0, 0, 0.6);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    color: #4df;
    display: flex;
    gap: 8px;
    letter-spacing: 0.5px;
    pointer-events: none;
    border: 1px solid rgba(0, 220, 255, 0.3);
  }

  /* BOTTOM SCREEN: Touch Screen & Radar/Inventory */
  .bottom-screen-housing {
    width: 78%;
    height: 175px;
    background: #06090e;
    border: 3px solid #1f2a37;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  #touch-canvas {
    width: 100%;
    height: 100%;
    display: block;
    background: radial-gradient(circle at center, #0f1c29, #05080c);
  }

  /* CONTROLLER AREA */
  .controls-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 8px;
  }

  /* Circle Pad / D-Pad */
  .dpad-container {
    width: 110px;
    height: 110px;
    position: relative;
  }
  .circle-pad {
    width: 80px;
    height: 80px;
    background: radial-gradient(circle, #3d5066 30%, #202b38 80%);
    border-radius: 50%;
    position: absolute;
    top: 15px;
    left: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.2);
    border: 2px solid #577395;
    touch-action: none;
    cursor: pointer;
  }
  .circle-pad-nub {
    width: 36px;
    height: 36px;
    background: radial-gradient(circle, #5b799a, #2b3b4f);
    border-radius: 50%;
    position: absolute;
    top: 20px;
    left: 20px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.6);
    pointer-events: none;
    transition: transform 0.05s ease-out;
  }

  /* Action Buttons A, B, X, Y */
  .abxy-cluster {
    position: relative;
    width: 110px;
    height: 110px;
  }
  .btn-3ds {
    width: 34px;
    height: 34px;
    background: #1b2633;
    border: 2px solid #3d5773;
    border-radius: 50%;
    color: #e2ecf5;
    font-weight: 800;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(0,0,0,0.6), inset 0 2px 2px rgba(255,255,255,0.2);
    transition: all 0.08s ease;
  }
  .btn-3ds:active {
    transform: translateY(2px);
    background: #3972a8;
    color: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }
  .btn-x { top: 6px; left: 38px; border-color: #4ea8de; }
  .btn-a { top: 38px; left: 70px; border-color: #ef476f; }
  .btn-b { top: 70px; left: 38px; border-color: #ffd166; }
  .btn-y { top: 38px; left: 6px; border-color: #06d6a0; }

  /* 3D Depth Slider on side */
  .slider-box {
    position: absolute;
    right: 6px;
    top: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 9px;
    color: #64819e;
    font-weight: bold;
    gap: 4px;
  }
  .slider-track {
    width: 6px;
    height: 80px;
    background: #080d14;
    border-radius: 3px;
    position: relative;
    border: 1px solid #2d4259;
  }
  .slider-knob {
    width: 14px;
    height: 18px;
    background: #4ea8de;
    border-radius: 3px;
    position: absolute;
    left: -4px;
    top: 10px;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  /* HUD overlay on 3DS touch screen */
  .touch-hud {
    position: absolute;
    bottom: 6px;
    width: 100%;
    display: flex;
    justify-content: space-around;
    padding: 0 4px;
    pointer-events: none;
  }
  .touch-badge {
    background: rgba(14, 27, 43, 0.85);
    border: 1px solid #365575;
    border-radius: 12px;
    padding: 3px 8px;
    font-size: 10px;
    color: #8ac0e8;
    pointer-events: auto;
    cursor: pointer;
  }
  .touch-badge:active { background: #3972a8; color: #fff; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="console-chassis">
  <!-- 3D Slider indicator -->
  <div class="slider-box">
    <span>3D</span>
    <div class="slider-track" id="sliderTrack">
      <div class="slider-knob" id="sliderKnob"></div>
    </div>
    <span>OFF</span>
  </div>

  <!-- TOP SCREEN (3D Graphics Screen) -->
  <div class="top-screen-housing">
    <div class="screen-banner">
      <span>★ 3DS EXPEDITION</span>
      <span id="score-text">STARS: 0/10</span>
      <span id="hp-text">HP: 100</span>
    </div>
    <canvas id="webgl-canvas"></canvas>
  </div>

  <div class="hinge"></div>

  <!-- BOTTOM SCREEN (Interactive Touch Screen & Radar) -->
  <div class="bottom-screen-housing">
    <canvas id="touch-canvas"></canvas>
    <div class="touch-hud">
      <div class="touch-badge" id="btn-spin">⚡ SPIN ATTACK</div>
      <div class="touch-badge" id="btn-boost">🚀 DASH</div>
      <div class="touch-badge" id="btn-reset">🔄 RESET</div>
    </div>
  </div>

  <!-- LOWER CONTROLS: Circle Pad + ABXY -->
  <div class="controls-row">
    <!-- Circle Pad for Movement -->
    <div class="dpad-container" id="circlePadArea">
      <div class="circle-pad" id="circlePadBase">
        <div class="circle-pad-nub" id="circlePadNub"></div>
      </div>
    </div>

    <!-- ABXY Buttons -->
    <div class="abxy-cluster">
      <button class="btn-3ds btn-x" id="btnX">X</button>
      <button class="btn-3ds btn-a" id="btnA">A</button>
      <button class="btn-3ds btn-b" id="btnB">B</button>
      <button class="btn-3ds btn-y" id="btnY">Y</button>
    </div>
  </div>
</div>

<script>
// --- AUDIO SYNTHESIZER ---
const AudioEngine = {
  ctx: null,
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
  },
  playTone(freq, type = 'square', duration = 0.1, gain = 0.1) {
    this.init();
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      g.gain.setValueAtTime(gain, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
      osc.connect(g);
      g.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch(e) {}
  },
  coin() {
    this.playTone(987, 'square', 0.08, 0.12);
    setTimeout(() => this.playTone(1318, 'square', 0.22, 0.14), 70);
  },
  jump() {
    this.init();
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(220, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(650, this.ctx.currentTime + 0.15);
      g.gain.setValueAtTime(0.15, this.ctx.currentTime);
      g.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
      osc.connect(g);
      g.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.15);
    } catch(e) {}
  },
  dash() {
    this.playTone(400, 'sawtooth', 0.12, 0.12);
  },
  attack() {
    this.playTone(180, 'sawtooth', 0.15, 0.15);
  }
};

// --- GAME STATE ---
const State = {
  score: 0,
  maxStars: 10,
  hp: 100,
  speed: 0.14,
  jumpV: 0,
  isGrounded: true,
  isSpinning: false,
  spinTimer: 0,
  depthLevel: 1.0,
  input: { x: 0, y: 0 }
};

// --- THREE.JS TOP SCREEN SETUP ---
const topCanvas = document.getElementById('webgl-canvas');
const renderer = new THREE.WebGLRenderer({ canvas: topCanvas, antialias: true });
renderer.setSize(topCanvas.clientWidth, topCanvas.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1724);
scene.fog = new THREE.FogExp2(0x0e1724, 0.04);

const camera = new THREE.PerspectiveCamera(50, topCanvas.clientWidth / topCanvas.clientHeight, 0.1, 100);
camera.position.set(0, 5, 8);

// Lights
const ambient = new THREE.AmbientLight(0x7090b0, 0.8);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xfffaed, 1.2);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
scene.add(dirLight);

// Retro 3DS Floating Island Terrain
const islandGeo = new THREE.CylinderGeometry(15, 12, 3, 32);
const islandMat = new THREE.MeshStandardMaterial({ color: 0x228B22, roughness: 0.8 });
const island = new THREE.Mesh(islandGeo, islandMat);
island.position.y = -1.5;
island.receiveShadow = true;
scene.add(island);

// Under-rock layer
const rockGeo = new THREE.CylinderGeometry(12, 4, 6, 24);
const rockMat = new THREE.MeshStandardMaterial({ color: 0x5a4d41, roughness: 0.9 });
const rock = new THREE.Mesh(rockGeo, rockMat);
rock.position.y = -5.5;
scene.add(rock);

// Decorative trees
function makeTree(x, z) {
  const group = new THREE.Group();
  const trunkGeo = new THREE.CylinderGeometry(0.2, 0.3, 1.2, 6);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6e4a2e });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.y = 0.6;
  group.add(trunk);

  const foliageGeo = new THREE.ConeGeometry(1, 2, 7);
  const foliageMat = new THREE.MeshStandardMaterial({ color: 0x1db954, flatShading: true });
  const foliage = new THREE.Mesh(foliageGeo, foliageMat);
  foliage.position.y = 2.0;
  group.add(foliage);
  group.position.set(x, 0, z);
  scene.add(group);
}
[ [-5, -4], [6, -5], [-7, 2], [7, 3], [-4, 6], [5, 6], [0, -8] ].forEach(pos => makeTree(pos[0], pos[1]));

// PLAYER MODEL (3DS Cute Chibi Hero)
const hero = new THREE.Group();
const bodyGeo = new THREE.SphereGeometry(0.5, 16, 16);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3a86ff, roughness: 0.3 });
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.position.y = 0.6;
hero.add(body);

const headGeo = new THREE.SphereGeometry(0.4, 16, 16);
const headMat = new THREE.MeshStandardMaterial({ color: 0xffd166 });
const head = new THREE.Mesh(headGeo, headMat);
head.position.y = 1.2;
hero.add(head);

const capGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.15, 16);
const capMat = new THREE.MeshStandardMaterial({ color: 0xef476f });
const cap = new THREE.Mesh(capGeo, capMat);
cap.position.set(0, 1.45, 0);
hero.add(cap);

const shadowGeo = new THREE.CircleGeometry(0.5, 16);
const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 });
const shadowDisc = new THREE.Mesh(shadowGeo, shadowMat);
shadowDisc.rotation.x = -Math.PI / 2;
shadowDisc.position.y = 0.02;
scene.add(shadowDisc);

hero.position.set(0, 0, 0);
scene.add(hero);

// COLLECTIBLE 3DS STARS
const stars = [];
const starGeo = new THREE.OctahedronGeometry(0.35, 0);
const starMat = new THREE.MeshStandardMaterial({
  color: 0xffe600,
  emissive: 0xffaa00,
  emissiveIntensity: 0.6,
  metalness: 0.8,
  roughness: 0.2
});

function spawnStars() {
  stars.forEach(s => scene.remove(s));
  stars.length = 0;
  for (let i = 0; i < State.maxStars; i++) {
    const star = new THREE.Mesh(starGeo, starMat);
    const rad = Math.random() * 8 + 2;
    const ang = Math.random() * Math.PI * 2;
    star.position.set(Math.cos(ang) * rad, 0.8 + Math.random() * 0.4, Math.sin(ang) * rad);
    star.baseY = star.position.y;
    star.spinOffset = Math.random() * 10;
    scene.add(star);
    stars.push(star);
  }
}
spawnStars();

// --- BOTTOM SCREEN RADAR & MAP DRAWING ---
const bottomCanvas = document.getElementById('touch-canvas');
const bCtx = bottomCanvas.getContext('2d');

function resizeScreens() {
  const topW = topCanvas.parentElement.clientWidth;
  const topH = topCanvas.parentElement.clientHeight;
  renderer.setSize(topW, topH);
  camera.aspect = topW / topH;
  camera.updateProjectionMatrix();

  bottomCanvas.width = bottomCanvas.parentElement.clientWidth;
  bottomCanvas.height = bottomCanvas.parentElement.clientHeight;
}
window.addEventListener('resize', resizeScreens);
setTimeout(resizeScreens, 50);

function drawBottomScreen() {
  const w = bottomCanvas.width;
  const h = bottomCanvas.height;
  bCtx.clearRect(0, 0, w, h);

  const cx = w / 2;
  const cy = h / 2 - 10;
  const radarR = Math.min(w, h) * 0.38;

  // Grid Circles
  bCtx.strokeStyle = 'rgba(74, 168, 222, 0.25)';
  bCtx.lineWidth = 1;
  bCtx.beginPath();
  bCtx.arc(cx, cy, radarR, 0, Math.PI * 2);
  bCtx.arc(cx, cy, radarR * 0.66, 0, Math.PI * 2);
  bCtx.arc(cx, cy, radarR * 0.33, 0, Math.PI * 2);
  bCtx.stroke();

  // Crosshairs
  bCtx.beginPath();
  bCtx.moveTo(cx - radarR, cy);
  bCtx.lineTo(cx + radarR, cy);
  bCtx.moveTo(cx, cy - radarR);
  bCtx.lineTo(cx + radarR, cy);
  bCtx.stroke();

  // Radar sweep line
  const now = performance.now() * 0.002;
  bCtx.strokeStyle = 'rgba(6, 214, 160, 0.4)';
  bCtx.beginPath();
  bCtx.moveTo(cx, cy);
  bCtx.lineTo(cx + Math.cos(now) * radarR, cy + Math.sin(now) * radarR);
  bCtx.stroke();

  // Draw Stars on Radar
  const mapScale = radarR / 14;
  stars.forEach(st => {
    const rx = cx + st.position.x * mapScale;
    const ry = cy + st.position.z * mapScale;
    bCtx.fillStyle = '#ffd166';
    bCtx.beginPath();
    bCtx.arc(rx, ry, 3.5, 0, Math.PI * 2);
    bCtx.fill();
  });

  // Draw Hero on Radar
  const px = cx + hero.position.x * mapScale;
  const py = cy + hero.position.z * mapScale;
  bCtx.fillStyle = '#4ea8de';
  bCtx.beginPath();
  bCtx.arc(px, py, 5, 0, Math.PI * 2);
  bCtx.fill();
  bCtx.strokeStyle = '#fff';
  bCtx.lineWidth = 1.5;
  bCtx.stroke();

  bCtx.fillStyle = '#90b4ce';
  bCtx.font = '10px monospace';
  bCtx.fillText(`POS: (${hero.position.x.toFixed(1)}, ${hero.position.z.toFixed(1)})`, 8, 16);
  bCtx.fillText(`3DS DUAL-SCREEN SYS ACTIVE`, 8, 30);
}

// --- CONTROLS & INTERACTION ---
const padArea = document.getElementById('circlePadArea');
const padNub = document.getElementById('circlePadNub');
let padActive = false;
let padOrigin = { x: 0, y: 0 };

function handlePadMove(clientX, clientY) {
  const dx = clientX - padOrigin.x;
  const dy = clientY - padOrigin.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const maxDist = 26;
  const clampedDist = Math.min(dist, maxDist);
  const angle = Math.atan2(dy, dx);

  const nx = Math.cos(angle) * clampedDist;
  const ny = Math.sin(angle) * clampedDist;

  padNub.style.transform = `translate(${nx}px, ${ny}px)`;
  State.input.x = nx / maxDist;
  State.input.y = ny / maxDist;
}

padArea.addEventListener('pointerdown', e => {
  AudioEngine.init();
  padActive = true;
  const rect = padArea.getBoundingClientRect();
  padOrigin = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
  handlePadMove(e.clientX, e.clientY);
  padArea.setPointerCapture(e.pointerId);
});

padArea.addEventListener('pointermove', e => {
  if (padActive) handlePadMove(e.clientX, e.clientY);
});

const endPad = () => {
  padActive = false;
  padNub.style.transform = `translate(0px, 0px)`;
  State.input.x = 0;
  State.input.y = 0;
};
padArea.addEventListener('pointerup', endPad);
padArea.addEventListener('pointercancel', endPad);

// Keyboard controls
const keys = {};
window.addEventListener('keydown', e => {
  AudioEngine.init();
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ' || e.key.toLowerCase() === 'a') doJump();
  if (e.key.toLowerCase() === 'b' || e.key.toLowerCase() === 'x') doSpin();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function updateKeyboardInput() {
  if (!padActive) {
    let kx = 0, ky = 0;
    if (keys['arrowleft'] || keys['a']) kx -= 1;
    if (keys['arrowright'] || keys['d']) kx += 1;
    if (keys['arrowup'] || keys['w']) ky -= 1;
    if (keys['arrowdown'] || keys['s']) ky += 1;
    State.input.x = kx;
    State.input.y = ky;
  }
}

function doJump() {
  if (State.isGrounded) {
    State.jumpV = 0.22;
    State.isGrounded = false;
    AudioEngine.jump();
  }
}

function doSpin() {
  if (!State.isSpinning) {
    State.isSpinning = true;
    State.spinTimer = 0.4;
    AudioEngine.attack();
  }
}

function doDash() {
  State.speed = 0.28;
  AudioEngine.dash();
  setTimeout(() => { State.speed = 0.14; }, 350);
}

document.getElementById('btnA').addEventListener('click', doJump);
document.getElementById('btnB').addEventListener('click', doSpin);
document.getElementById('btnX').addEventListener('click', doDash);
document.getElementById('btnY').addEventListener('click', () => {
  AudioEngine.playTone(523, 'sine', 0.1, 0.1);
});

document.getElementById('btn-spin').addEventListener('click', doSpin);
document.getElementById('btn-boost').addEventListener('click', doDash);
document.getElementById('btn-reset').addEventListener('click', () => {
  State.score = 0;
  hero.position.set(0, 0, 0);
  spawnStars();
  document.getElementById('score-text').innerText = `STARS: 0/${State.maxStars}`;
  AudioEngine.coin();
});

// 3D Depth Slider
const sliderKnob = document.getElementById('sliderKnob');
let sliderDrag = false;
sliderKnob.parentElement.addEventListener('pointerdown', e => {
  sliderDrag = true;
  updateSlider(e.clientY);
});
window.addEventListener('pointermove', e => {
  if (sliderDrag) updateSlider(e.clientY);
});
window.addEventListener('pointerup', () => sliderDrag = false);

function updateSlider(clientY) {
  const track = document.getElementById('sliderTrack');
  const rect = track.getBoundingClientRect();
  const y = Math.max(0, Math.min(rect.height - 18, clientY - rect.top));
  sliderKnob.style.top = y + 'px';
  State.depthLevel = 1.0 - (y / (rect.height - 18));
}

// --- MAIN LOOP ---
let lastTime = performance.now();

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  updateKeyboardInput();

  const mx = State.input.x;
  const mz = State.input.y;
  if (Math.abs(mx) > 0.05 || Math.abs(mz) > 0.05) {
    hero.position.x += mx * State.speed;
    hero.position.z += mz * State.speed;

    const targetAngle = Math.atan2(mx, mz);
    hero.rotation.y = targetAngle;
    body.position.y = 0.6 + Math.abs(Math.sin(now * 0.012)) * 0.08;
  }

  const distFromCenter = Math.sqrt(hero.position.x * hero.position.x + hero.position.z * hero.position.z);
  if (distFromCenter > 13.5) {
    hero.position.x = (hero.position.x / distFromCenter) * 13.5;
    hero.position.z = (hero.position.z / distFromCenter) * 13.5;
  }

  if (!State.isGrounded) {
    hero.position.y += State.jumpV;
    State.jumpV -= 0.011;
    if (hero.position.y <= 0) {
      hero.position.y = 0;
      State.isGrounded = true;
      State.jumpV = 0;
    }
  }

  if (State.isSpinning) {
    hero.rotation.y += 0.45;
    State.spinTimer -= dt;
    if (State.spinTimer <= 0) State.isSpinning = false;
  }

  shadowDisc.position.x = hero.position.x;
  shadowDisc.position.z = hero.position.z;
  const shadowScale = Math.max(0.2, 1 - hero.position.y * 0.4);
  shadowDisc.scale.set(shadowScale, shadowScale, 1);

  stars.forEach((star, idx) => {
    star.rotation.y += 0.03;
    star.position.y = star.baseY + Math.sin(now * 0.003 + star.spinOffset) * 0.15;

    const dx = star.position.x - hero.position.x;
    const dy = star.position.y - (hero.position.y + 0.6);
    const dz = star.position.z - hero.position.z;
    const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

    if (distance < 1.0) {
      scene.remove(star);
      stars.splice(idx, 1);
      State.score++;
      document.getElementById('score-text').innerText = `STARS: ${State.score}/${State.maxStars}`;
      AudioEngine.coin();
      if (stars.length === 0) {
        setTimeout(() => {
          alert('★ STAGE CLEAR! You collected all the Power Stars on the 3DS floating island!');
          spawnStars();
          State.score = 0;
          document.getElementById('score-text').innerText = `STARS: 0/${State.maxStars}`;
        }, 150);
      }
    }
  });

  camera.position.x = hero.position.x * 0.7;
  camera.position.z = hero.position.z * 0.7 + 7.5 + (1 - State.depthLevel) * 2;
  camera.position.y = 4.8 + hero.position.y * 0.3;
  camera.lookAt(hero.position.x, 0.8 + hero.position.y * 0.5, hero.position.z);

  renderer.render(scene, camera);
  drawBottomScreen();
}

animate();
</script>
</body>
</html>
