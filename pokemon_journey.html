<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pokémon: Ash's 2D Journey (Portrait Edition)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background-color: #0f172a;
    color: #f8fafc;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #game-container {
    width: 100vw;
    max-width: 440px;
    height: 100vh;
    max-height: 840px;
    background: #e11d48;
    border: 6px solid #9f1239;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    position: relative;
    overflow: hidden;
  }
  #pokedex-header {
    height: 48px;
    background: #be123c;
    display: flex;
    align-items: center;
    padding: 0 16px;
    border-bottom: 4px solid #881337;
    position: relative;
  }
  .blue-lens {
    width: 28px;
    height: 28px;
    background: radial-gradient(circle at 8px 8px, #38bdf8, #0284c7);
    border: 3px solid #f8fafc;
    border-radius: 50%;
    box-shadow: 0 0 12px #38bdf8;
  }
  .indicator-lights {
    display: flex;
    gap: 8px;
    margin-left: 12px;
  }
  .indicator-light {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1px solid #1e293b;
  }
  .light-red { background: #ef4444; }
  .light-yellow { background: #eab308; }
  .light-green { background: #22c55e; }
  #title-text {
    margin-left: auto;
    font-weight: bold;
    font-size: 13px;
    letter-spacing: 1px;
    color: #fecdd3;
  }
  #screen-bezel {
    flex: 1;
    background: #334155;
    margin: 12px 16px;
    border-radius: 12px;
    border: 4px solid #1e293b;
    display: flex;
    flex-direction: column;
    padding: 10px;
    position: relative;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
  }
  #canvas-wrapper {
    flex: 1;
    background: #000;
    border-radius: 6px;
    overflow: hidden;
    position: relative;
  }
  canvas {
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    display: block;
  }
  /* Controls Area */
  #controls-area {
    height: 220px;
    background: #9f1239;
    border-top: 4px solid #881337;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    position: relative;
  }
  /* D-PAD */
  .dpad {
    position: relative;
    width: 120px;
    height: 120px;
  }
  .dpad-btn {
    position: absolute;
    background: #1e293b;
    border: 2px solid #0f172a;
    box-shadow: 0 4px 0 #020617;
    cursor: pointer;
    active: background #334155;
  }
  .dpad-btn:active {
    box-shadow: 0 0 0 #020617;
    transform: translateY(4px);
  }
  .dpad-up { top: 0; left: 40px; width: 40px; height: 42px; border-radius: 6px 6px 0 0; }
  .dpad-down { bottom: 0; left: 40px; width: 40px; height: 42px; border-radius: 0 0 6px 6px; }
  .dpad-left { top: 40px; left: 0; width: 42px; height: 40px; border-radius: 6px 0 0 6px; }
  .dpad-right { top: 40px; right: 0; width: 42px; height: 40px; border-radius: 0 6px 6px 0; }
  .dpad-center { top: 40px; left: 40px; width: 40px; height: 40px; background: #1e293b; }

  /* Action Buttons A & B */
  .action-buttons {
    display: flex;
    gap: 16px;
    transform: rotate(-22deg);
    margin-right: 12px;
  }
  .act-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #e11d48;
    border: 3px solid #881337;
    box-shadow: 0 5px 0 #4c0519;
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .act-btn:active {
    box-shadow: 0 0 0 #4c0519;
    transform: translateY(5px);
  }
  .btn-b { background: #f43f5e; }
  .btn-a { background: #10b981; border-color: #047857; box-shadow: 0 5px 0 #064e3b; }

  /* Sub buttons */
  .sub-buttons {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 24px;
  }
  .pill-btn {
    background: #475569;
    border: 1px solid #1e293b;
    border-radius: 12px;
    width: 54px;
    height: 14px;
    transform: rotate(-25deg);
    box-shadow: 0 2px 0 #0f172a;
    cursor: pointer;
  }
  .pill-btn:active {
    transform: rotate(-25deg) translateY(2px);
    box-shadow: none;
  }
  .btn-label {
    font-size: 9px;
    color: #fecdd3;
    text-align: center;
    margin-top: 16px;
    font-weight: bold;
  }
</style>
</head>
<body>

<div id="game-container">
  <div id="pokedex-header">
    <div class="blue-lens"></div>
    <div class="indicator-lights">
      <div class="indicator-light light-red"></div>
      <div class="indicator-light light-yellow"></div>
      <div class="indicator-light light-green"></div>
    </div>
    <div id="title-text">ASH'S JOURNEY 2D</div>
  </div>

  <div id="screen-bezel">
    <div id="canvas-wrapper">
      <canvas id="gameCanvas" width="320" height="420"></canvas>
    </div>
  </div>

  <div id="controls-area">
    <div class="dpad">
      <button class="dpad-btn dpad-up" id="btn-up"></button>
      <button class="dpad-btn dpad-down" id="btn-down"></button>
      <button class="dpad-btn dpad-left" id="btn-left"></button>
      <button class="dpad-btn dpad-right" id="btn-right"></button>
      <div class="dpad-center"></div>
    </div>

    <div class="sub-buttons">
      <div>
        <button class="pill-btn" id="btn-select"></button>
        <div class="btn-label">SELECT</div>
      </div>
      <div>
        <button class="pill-btn" id="btn-start"></button>
        <div class="btn-label">START</div>
      </div>
    </div>

    <div class="action-buttons">
      <div>
        <button class="act-btn btn-b" id="btn-b">B</button>
      </div>
      <div>
        <button class="act-btn btn-a" id="btn-a">A</button>
      </div>
    </div>
  </div>
</div>

<script>
// --- Web Audio Synthesizer ---
class SoundSynth {
  constructor() {
    this.ctx = null;
    this.enabled = true;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  playTone(freq, type, duration, delay = 0) {
    if (!this.enabled || !this.ctx) return;
    setTimeout(() => {
      try {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      } catch (e) {}
    }, delay * 1000);
  }
  bump() { this.init(); this.playTone(120, 'square', 0.08); }
  select() { this.init(); this.playTone(440, 'sine', 0.06); }
  attack() {
    this.init();
    this.playTone(520, 'sawtooth', 0.1);
    this.playTone(320, 'sawtooth', 0.15, 0.08);
  }
  thunderbolt() {
    this.init();
    for(let i=0; i<6; i++) {
      this.playTone(600 + Math.random()*400, 'square', 0.05, i*0.04);
    }
  }
  encounter() {
    this.init();
    for(let i=0; i<5; i++) {
      this.playTone(300 + i*100, 'square', 0.08, i*0.06);
    }
  }
  victory() {
    this.init();
    [523, 587, 659, 783, 880, 1046].forEach((f, idx) => {
      this.playTone(f, 'square', 0.18, idx * 0.12);
    });
  }
}
const sound = new SoundSynth();

// --- Game Engine Constants & States ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const TILE_SIZE = 20;
const MAP_COLS = 16;
const MAP_ROWS = 21;

// Colors Palette
const C = {
  GRASS: '#4ade80',
  TALL_GRASS: '#16a34a',
  PATH: '#fde047',
  WATER: '#38bdf8',
  WALL: '#94a3b8',
  ROOF_RED: '#ef4444',
  ROOF_BLUE: '#3b82f6',
  DOOR: '#78350f',
  TREE_DARK: '#15803d',
  WHITE: '#ffffff',
  BLACK: '#0f172a',
  UI_BG: '#1e293b',
  UI_BORDER: '#f8fafc',
  TEXT_GOLD: '#fbbf24'
};

// World Locations / Chapters
const CHAPTERS = [
  { name: 'Pallet Town', gymLeader: null, badge: null, wildLevel: 2 },
  { name: 'Route 1 Grasslands', gymLeader: null, badge: null, wildLevel: 3 },
  { name: 'Viridian Forest', gymLeader: null, badge: null, wildLevel: 5 },
  { name: 'Pewter City Gym', gymLeader: 'Brock', badge: 'Boulder Badge', wildLevel: 8 },
  { name: 'Cerulean City Gym', gymLeader: 'Misty', badge: 'Cascade Badge', wildLevel: 12 },
  { name: 'Vermilion City Gym', gymLeader: 'Lt. Surge', badge: 'Thunder Badge', wildLevel: 16 },
  { name: 'Indigo Plateau Final', gymLeader: 'Gary Oak', badge: 'Champion Trophy', wildLevel: 22 }
];

// Player State (Ash Ketchum)
const player = {
  x: 7,
  y: 16,
  facing: 'up',
  step: 0,
  team: [
    {
      name: 'Pikachu',
      level: 5,
      hp: 22,
      maxHp: 22,
      exp: 0,
      moves: [
        { name: 'Thunderbolt', pwr: 20, type: 'Electric' },
        { name: 'Quick Attack', pwr: 12, type: 'Normal' },
        { name: 'Iron Tail', pwr: 15, type: 'Steel' },
        { name: 'Electro Ball', pwr: 18, type: 'Electric' }
      ]
    }
  ],
  pokeballs: 5,
  potions: 3,
  badges: [],
  currentChapter: 0
};

let gameState = 'OVERWORLD'; // OVERWORLD, BATTLE, DIALOGUE, MENU
let dialogueText = '';
let dialogueCallback = null;
let battleData = null;

// Overworld Map Generator based on chapter
function getMapTile(x, y) {
  // Border trees
  if (x === 0 || x === MAP_COLS - 1 || y === 0 || y === MAP_ROWS - 1) return 1; // Tree

  const ch = player.currentChapter;
  if (ch === 0) {
    // Pallet Town: Oak's Lab, Ash's House, Paths
    if (x >= 2 && x <= 6 && y >= 3 && y <= 6) return (x === 4 && y === 6) ? 4 : 2; // Lab & Door
    if (x >= 9 && x <= 13 && y >= 3 && y <= 6) return (x === 11 && y === 6) ? 4 : 3; // House & Door
    if (x >= 6 && x <= 9 && y >= 7) return 5; // Path
    if (x >= 1 && x <= 4 && y >= 11 && y <= 14) return 6; // Water pond
    if (y === 1 && (x === 7 || x === 8)) return 9; // Exit North
    return 0; // Grass
  } else if (ch === 1 || ch === 2) {
    // Wild Routes & Forest
    if (y === 1 && (x === 7 || x === 8)) return 9; // Exit North
    if (x === 7 || x === 8) return 5; // Path
    if ((x + y) % 3 === 0) return 7; // Tall Grass (Encounters!)
    if ((x * y) % 7 === 0) return 1; // Trees
    return 0;
  } else {
    // Gym Cities
    if (x >= 4 && x <= 11 && y >= 3 && y <= 8) return (x === 7 && y === 8) ? 4 : 8; // Gym Arena Building
    if (y === 1 && (x === 7 || x === 8)) return 9; // Next chapter exit
    if (x === 7 || x === 8) return 5; // Path
    return 0;
  }
}

// Draw Pixel Character (Ash & Pikachu)
function drawAsh(ctx, px, py, facing, frame) {
  ctx.save();
  ctx.translate(px, py);
  // Cap
  ctx.fillStyle = '#ef4444';
  ctx.fillRect(4, 1, 12, 4);
  ctx.fillStyle = '#f8fafc';
  ctx.fillRect(8, 2, 4, 2);
  // Visor
  ctx.fillStyle = '#22c55e';
  ctx.fillRect(facing === 'left' ? 2 : (facing === 'right' ? 14 : 4), 4, 4, 1);
  // Face & Hair
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(3, 3, 3, 5); ctx.fillRect(14, 3, 3, 5);
  ctx.fillStyle = '#fed7aa';
  ctx.fillRect(5, 5, 10, 5);
  // Eyes
  ctx.fillStyle = '#0f172a';
  if (facing === 'up') {
    // back of head hair
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(5, 5, 10, 5);
  } else {
    ctx.fillRect(7, 6, 2, 2); ctx.fillRect(11, 6, 2, 2);
  }
  // Blue Jacket
  ctx.fillStyle = '#2563eb';
  ctx.fillRect(4, 10, 12, 6);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(8, 10, 4, 6); // white shirt
  // Jeans
  ctx.fillStyle = '#1e3a8a';
  const legOffset = frame % 2 === 0 ? 0 : 2;
  ctx.fillRect(5, 16, 4, 4 - legOffset);
  ctx.fillRect(11, 16, 4, 4 + legOffset);
  ctx.restore();
}

function drawPikachu(ctx, px, py) {
  ctx.save();
  ctx.translate(px, py);
  // Body & Head
  ctx.fillStyle = '#facc15';
  ctx.fillRect(4, 5, 12, 11);
  // Ears with black tips
  ctx.fillRect(3, 1, 3, 5); ctx.fillRect(14, 1, 3, 5);
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(3, 1, 3, 2); ctx.fillRect(14, 1, 3, 2);
  // Red Cheeks
  ctx.fillStyle = '#ef4444';
  ctx.fillRect(3, 9, 2, 2); ctx.fillRect(15, 9, 2, 2);
  // Eyes
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(6, 7, 2, 2); ctx.fillRect(12, 7, 2, 2);
  // Lightning Tail
  ctx.fillStyle = '#ca8a04';
  ctx.fillRect(facingX(px), 11, 4, 2);
  ctx.restore();
}
function facingX(p) { return p % 2 === 0 ? 1 : 15; }

// --- Overworld Rendering ---
function renderOverworld() {
  ctx.fillStyle = C.BLACK;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let r = 0; r < MAP_ROWS; r++) {
    for (let c = 0; c < MAP_COLS; c++) {
      const tile = getMapTile(c, r);
      const tx = c * TILE_SIZE;
      const ty = r * TILE_SIZE;

      if (tile === 0) { // Grass
        ctx.fillStyle = C.GRASS;
        ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
      } else if (tile === 1) { // Tree
        ctx.fillStyle = C.TREE_DARK;
        ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = '#166534';
        ctx.fillRect(tx + 4, ty + 4, TILE_SIZE - 8, TILE_SIZE - 8);
      } else if (tile === 2 || tile === 3 || tile === 8) { // Buildings
        ctx.fillStyle = tile === 8 ? C.ROOF_RED : C.WALL;
        ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
      } else if (tile === 4) { // Door
        ctx.fillStyle = C.DOOR;
        ctx.fillRect(tx + 3, ty + 2, TILE_SIZE - 6, TILE_SIZE - 2);
      } else if (tile === 5) { // Path
        ctx.fillStyle = C.PATH;
        ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
      } else if (tile === 6) { // Water
        ctx.fillStyle = C.WATER;
        ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
      } else if (tile === 7) { // Tall Grass
        ctx.fillStyle = C.GRASS;
        ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = C.TALL_GRASS;
        ctx.fillRect(tx + 2, ty + 4, 4, 12);
        ctx.fillRect(tx + 8, ty + 2, 4, 14);
        ctx.fillRect(tx + 14, ty + 5, 4, 11);
      } else if (tile === 9) { // Portal exit
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
      }
    }
  }

  // Draw Pikachu following Ash
  let pikaX = player.x * TILE_SIZE;
  let pikaY = (player.y + 1) * TILE_SIZE;
  if (player.facing === 'down') pikaY = (player.y - 1) * TILE_SIZE;
  if (player.facing === 'left') pikaX = (player.x + 1) * TILE_SIZE;
  if (player.facing === 'right') pikaX = (player.x - 1) * TILE_SIZE;
  drawPikachu(ctx, pikaX, pikaY);

  // Draw Ash Ketchum
  drawAsh(ctx, player.x * TILE_SIZE, player.y * TILE_SIZE, player.facing, player.step);

  // Top Location Header HUD
  ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
  ctx.fillRect(8, 8, canvas.width - 16, 26);
  ctx.fillStyle = C.TEXT_GOLD;
  ctx.font = 'bold 11px monospace';
  ctx.fillText(`📍 ${CHAPTERS[player.currentChapter].name}`, 16, 25);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(`Badges: ${player.badges.length}/4`, 220, 25);
}

// --- Battle System ---
const ENEMY_ROSTER = [
  { name: 'Pidgey', hp: 18, pwr: 8, color: '#b45309' },
  { name: 'Caterpie', hp: 15, pwr: 6, color: '#16a34a' },
  { name: 'Rattata', hp: 17, pwr: 9, color: '#7c3aed' },
  { name: 'Geodude', hp: 28, pwr: 12, color: '#78716c' },
  { name: 'Onix', hp: 38, pwr: 15, color: '#57534e' },
  { name: 'Starmie', hp: 34, pwr: 14, color: '#38bdf8' },
  { name: 'Raichu', hp: 42, pwr: 18, color: '#eab308' },
  { name: 'Blastoise', hp: 55, pwr: 22, color: '#2563eb' }
];

function startBattle(isGym = false) {
  sound.encounter();
  gameState = 'BATTLE';

  let enemyTemplate;
  const ch = player.currentChapter;
  if (isGym && CHAPTERS[ch].gymLeader) {
    if (ch === 3) enemyTemplate = ENEMY_ROSTER[4]; // Onix (Brock)
    else if (ch === 4) enemyTemplate = ENEMY_ROSTER[5]; // Starmie (Misty)
    else if (ch === 5) enemyTemplate = ENEMY_ROSTER[6]; // Raichu (Lt. Surge)
    else enemyTemplate = ENEMY_ROSTER[7]; // Blastoise (Gary Oak)
  } else {
    enemyTemplate = ENEMY_ROSTER[Math.floor(Math.random() * 3)];
  }

  const pika = player.team[0];
  battleData = {
    isGym: isGym,
    enemy: {
      name: enemyTemplate.name,
      hp: enemyTemplate.hp,
      maxHp: enemyTemplate.hp,
      level: CHAPTERS[ch].wildLevel,
      color: enemyTemplate.color
    },
    player: pika,
    selectedMove: 0,
    turn: 'PLAYER',
    log: `${isGym ? CHAPTERS[ch].gymLeader : 'Wild ' + enemyTemplate.name} appeared!`
  };
}

function renderBattle() {
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Battle Arena Background
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(10, 10, canvas.width - 20, 240);

  // Enemy Platform & Sprite
  ctx.fillStyle = '#334155';
  ctx.beginPath();
  ctx.ellipse(220, 100, 70, 25, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = battleData.enemy.color;
  ctx.beginPath();
  ctx.arc(220, 80, 26, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#f8fafc';
  ctx.fillRect(212, 74, 4, 4); ctx.fillRect(224, 74, 4, 4); // eyes

  // Enemy HUD Card
  drawCombatCard(16, 20, battleData.enemy.name, battleData.enemy.level, battleData.enemy.hp, battleData.enemy.maxHp);

  // Player (Pikachu) Platform & Back Sprite
  ctx.fillStyle = '#334155';
  ctx.beginPath();
  ctx.ellipse(90, 210, 65, 22, 0, 0, Math.PI * 2);
  ctx.fill();

  // Pikachu back
  ctx.fillStyle = '#facc15';
  ctx.beginPath();
  ctx.arc(90, 180, 28, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ca8a04';
  ctx.fillRect(82, 160, 6, 8); ctx.fillRect(94, 160, 6, 8); // stripes

  // Player HUD Card
  drawCombatCard(160, 140, battleData.player.name, battleData.player.level, battleData.player.hp, battleData.player.maxHp);

  // Battle Action Menu / Command Box
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(10, 260, canvas.width - 20, 145);
  ctx.strokeStyle = '#f8fafc';
  ctx.lineWidth = 3;
  ctx.strokeRect(10, 260, canvas.width - 20, 145);

  // Battle Log Line
  ctx.fillStyle = C.TEXT_GOLD;
  ctx.font = 'bold 11px monospace';
  ctx.fillText(battleData.log, 20, 282);

  // Moves 2x2 Grid
  const moves = battleData.player.moves;
  moves.forEach((m, idx) => {
    const mx = idx % 2 === 0 ? 24 : 170;
    const my = idx < 2 ? 310 : 355;
    const isSel = battleData.selectedMove === idx;

    ctx.fillStyle = isSel ? '#2563eb' : '#334155';
    ctx.fillRect(mx, my, 126, 36);
    ctx.strokeStyle = isSel ? '#fbbf24' : '#64748b';
    ctx.strokeRect(mx, my, 126, 36);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 11px monospace';
    ctx.fillText(m.name, mx + 8, my + 18);
    ctx.fillStyle = '#94a3b8';
    ctx.font = '9px monospace';
    ctx.fillText(`${m.type} • PWR ${m.pwr}`, mx + 8, my + 30);
  });
}

function drawCombatCard(x, y, name, lvl, hp, maxHp) {
  ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
  ctx.fillRect(x, y, 145, 48);
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, 145, 48);

  ctx.fillStyle = '#f8fafc';
  ctx.font = 'bold 11px monospace';
  ctx.fillText(name, x + 8, y + 16);
  ctx.fillStyle = '#fbbf24';
  ctx.fillText(`Lv.${lvl}`, x + 105, y + 16);

  // HP Bar
  const pct = Math.max(0, hp / maxHp);
  ctx.fillStyle = '#334155';
  ctx.fillRect(x + 8, y + 26, 128, 8);
  ctx.fillStyle = pct > 0.5 ? '#22c55e' : (pct > 0.2 ? '#eab308' : '#ef4444');
  ctx.fillRect(x + 8, y + 26, Math.floor(128 * pct), 8);

  ctx.fillStyle = '#cbd5e1';
  ctx.font = '9px monospace';
  ctx.fillText(`HP: ${hp}/${maxHp}`, x + 8, y + 44);
}

// Player Battle Turn Action
function playerAttack() {
  if (battleData.turn !== 'PLAYER') return;
  const move = battleData.player.moves[battleData.selectedMove];
  if (move.name.includes('Thunder')) sound.thunderbolt();
  else sound.attack();

  const dmg = Math.floor(move.pwr * (0.8 + Math.random() * 0.4));
  battleData.enemy.hp = Math.max(0, battleData.enemy.hp - dmg);
  battleData.log = `${battleData.player.name} used ${move.name}! (-${dmg} HP)`;

  if (battleData.enemy.hp === 0) {
    sound.victory();
    battleData.log = `${battleData.enemy.name} fainted! Victory!`;
    setTimeout(() => {
      if (battleData.isGym) {
        const badge = CHAPTERS[player.currentChapter].badge;
        player.badges.push(badge);
        showDialogue(`Congratulations Ash! You earned the ${badge}!`, () => {
          player.currentChapter = Math.min(CHAPTERS.length - 1, player.currentChapter + 1);
          player.x = 7; player.y = 17;
          gameState = 'OVERWORLD';
        });
      } else {
        // Gain EXP & Level Up
        player.team[0].exp += 15;
        if (player.team[0].exp >= 40) {
          player.team[0].level += 1;
          player.team[0].maxHp += 4;
          player.team[0].hp = player.team[0].maxHp;
          player.team[0].exp = 0;
          showDialogue(`Pikachu leveled up to Lv.${player.team[0].level}!`, () => {
            gameState = 'OVERWORLD';
          });
        } else {
          gameState = 'OVERWORLD';
        }
      }
    }, 1200);
  } else {
    // Enemy Turn
    battleData.turn = 'ENEMY';
    setTimeout(enemyAttack, 1000);
  }
}

function enemyAttack() {
  sound.attack();
  const dmg = Math.floor(6 + Math.random() * 5);
  battleData.player.hp = Math.max(0, battleData.player.hp - dmg);
  battleData.log = `${battleData.enemy.name} retaliated! (-${dmg} HP)`;

  if (battleData.player.hp === 0) {
    battleData.log = `Pikachu fainted! Rushing to Nurse Joy...`;
    setTimeout(() => {
      player.team[0].hp = player.team[0].maxHp;
      player.x = 7; player.y = 16;
      showDialogue("Nurse Joy restored your Pikachu back to full health!", () => {
        gameState = 'OVERWORLD';
      });
    }, 1500);
  } else {
    battleData.turn = 'PLAYER';
  }
}

// Dialogue Box
function showDialogue(text, callback = null) {
  gameState = 'DIALOGUE';
  dialogueText = text;
  dialogueCallback = callback;
}

function renderDialogue() {
  renderOverworld();
  ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
  ctx.fillRect(10, 280, canvas.width - 20, 120);
  ctx.strokeStyle = '#f8fafc';
  ctx.lineWidth = 3;
  ctx.strokeRect(10, 280, canvas.width - 20, 120);

  ctx.fillStyle = '#fbbf24';
  ctx.font = 'bold 12px monospace';
  ctx.fillText('NARRATOR / PROF. OAK', 22, 305);

  ctx.fillStyle = '#ffffff';
  ctx.font = '12px monospace';
  // Simple word wrap
  const words = dialogueText.split(' ');
  let line = '';
  let y = 328;
  for (let w of words) {
    if ((line + w).length > 32) {
      ctx.fillText(line, 22, y);
      line = w + ' ';
      y += 18;
    } else {
      line += w + ' ';
    }
  }
  ctx.fillText(line, 22, y);

  ctx.fillStyle = '#38bdf8';
  ctx.font = '10px monospace';
  ctx.fillText('▼ Press (A) to continue', 170, 388);
}

// --- Movement & Input Handling ---
function movePlayer(dx, dy, dir) {
  if (gameState !== 'OVERWORLD') return;
  player.facing = dir;
  player.step++;
  sound.bump();

  const nx = player.x + dx;
  const ny = player.y + dy;
  const tile = getMapTile(nx, ny);

  // Obstacle checks
  if (tile === 1 || tile === 2 || tile === 3 || tile === 6 || tile === 8) {
    return; // Blocked
  }

  // Door into Gym or Lab
  if (tile === 4) {
    const ch = player.currentChapter;
    if (CHAPTERS[ch].gymLeader) {
      showDialogue(`Entering ${CHAPTERS[ch].name}! Prepare for Gym Leader ${CHAPTERS[ch].gymLeader}!`, () => {
        startBattle(true);
      });
    } else {
      showDialogue("Professor Oak: 'Hello Ash! Train hard with Pikachu across Kanto!'");
    }
    return;
  }

  // Exit portal North
  if (tile === 9) {
    if (player.currentChapter < CHAPTERS.length - 1) {
      player.currentChapter++;
      player.x = 7;
      player.y = 18;
      showDialogue(`You reached ${CHAPTERS[player.currentChapter].name}!`);
      return;
    }
  }

  player.x = nx;
  player.y = ny;

  // Wild Encounter in Tall Grass (Tile 7)
  if (tile === 7 && Math.random() < 0.28) {
    startBattle(false);
  }
}

// Controller Actions
function handleA() {
  sound.select();
  if (gameState === 'DIALOGUE') {
    if (dialogueCallback) {
      const cb = dialogueCallback;
      dialogueCallback = null;
      cb();
    } else {
      gameState = 'OVERWORLD';
    }
  } else if (gameState === 'BATTLE') {
    playerAttack();
  } else if (gameState === 'OVERWORLD') {
    // Interact check facing tile
    let fx = player.x, fy = player.y;
    if (player.facing === 'up') fy--;
    if (player.facing === 'down') fy++;
    if (player.facing === 'left') fx--;
    if (player.facing === 'right') fx++;
    const t = getMapTile(fx, fy);
    if (t === 4) movePlayer(0, -1, 'up');
    else showDialogue(`Ash: "Pikachu and I are aiming for the Pokémon League!"`);
  }
}

function handleB() {
  sound.select();
  if (gameState === 'BATTLE' && battleData.turn === 'PLAYER' && !battleData.isGym) {
    // Run Away
    showDialogue("Got away safely!", () => { gameState = 'OVERWORLD'; });
  }
}

// Bind Button Elements
document.getElementById('btn-up').onclick = () => {
  if (gameState === 'BATTLE') battleData.selectedMove = (battleData.selectedMove + 2) % 4;
  else movePlayer(0, -1, 'up');
};
document.getElementById('btn-down').onclick = () => {
  if (gameState === 'BATTLE') battleData.selectedMove = (battleData.selectedMove + 2) % 4;
  else movePlayer(0, 1, 'down');
};
document.getElementById('btn-left').onclick = () => {
  if (gameState === 'BATTLE') battleData.selectedMove = (battleData.selectedMove + 3) % 4;
  else movePlayer(-1, 0, 'left');
};
document.getElementById('btn-right').onclick = () => {
  if (gameState === 'BATTLE') battleData.selectedMove = (battleData.selectedMove + 1) % 4;
  else movePlayer(1, 0, 'right');
};
document.getElementById('btn-a').onclick = handleA;
document.getElementById('btn-b').onclick = handleB;
document.getElementById('btn-start').onclick = () => {
  showDialogue(`POKÉMON STATS:\nTrainer: Ash Ketchum\nPikachu Lv.${player.team[0].level}\nBadges: ${player.badges.join(', ') || 'None'}`);
};

// Keyboard listener
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowUp' || e.key === 'w') document.getElementById('btn-up').click();
  if (e.key === 'ArrowDown' || e.key === 's') document.getElementById('btn-down').click();
  if (e.key === 'ArrowLeft' || e.key === 'a') document.getElementById('btn-left').click();
  if (e.key === 'ArrowRight' || e.key === 'd') document.getElementById('btn-right').click();
  if (e.key === 'z' || e.key === ' ' || e.key === 'Enter') handleA();
  if (e.key === 'x' || e.key === 'Escape') handleB();
});

// Main Loop
function mainLoop() {
  if (gameState === 'OVERWORLD') renderOverworld();
  else if (gameState === 'BATTLE') renderBattle();
  else if (gameState === 'DIALOGUE') renderDialogue();
  requestAnimationFrame(mainLoop);
}

// Initial intro dialogue
showDialogue("Professor Oak: 'Welcome Ash to the world of Pokémon! Journey north across Kanto and conquer all gyms!'");
requestAnimationFrame(mainLoop);
</script>
</body>
